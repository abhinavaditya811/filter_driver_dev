name: Validate CODEOWNERS

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, catches renamed/deleted accounts between PRs

permissions:
  contents: read

jobs:
  codeowners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check every line has a pattern and valid owners
        run: |
          awk '
            { sub(/#.*/, "") }
            NF == 0 { next }
            NF < 2 { print "Line " NR ": pattern \"" $1 "\" has no owners"; bad=1; next }
            { for (i = 2; i <= NF; i++) if ($i !~ /@/) { print "Line " NR ": \"" $i "\" is not a valid owner (use @username or an email)"; bad=1 } }
            END { exit bad }
          ' .github/CODEOWNERS
          echo "CODEOWNERS format looks good."

      - name: Check owners exist and have access (GitHub API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ github.event.pull_request.head.sha || github.sha }}"
          errors=$(gh api "repos/${{ github.repository }}/codeowners/errors?ref=$ref" --jq '.errors')
          if [ "$errors" != "[]" ]; then
            echo "CODEOWNERS has invalid entries:"
            echo "$errors" | jq .
            exit 1
          fi
          echo "CODEOWNERS owners are valid."